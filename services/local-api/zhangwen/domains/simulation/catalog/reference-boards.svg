<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="title desc">
  <title id="title">掌问 ESP32 教学参考板</title>
  <desc id="desc">原创的 ESP32-S3 与 ESP32-C3 抽象教学参考板图形</desc>
  <defs>
    <g id="esp32s3">
      <rect width="150" height="120" rx="18" fill="#0f766e"/>
      <rect x="38" y="30" width="74" height="58" rx="8" fill="#dff7f1"/>
      <text x="75" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#134e4a">ESP32-S3</text>
    </g>
    <g id="esp32c3">
      <rect width="150" height="120" rx="18" fill="#155e75"/>
      <rect x="38" y="30" width="74" height="58" rx="8" fill="#e0f2fe"/>
      <text x="75" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#164e63">ESP32-C3</text>
    </g>
  </defs>
  <use href="#esp32s3" x="15" y="30"/>
  <use href="#esp32c3" x="195" y="30"/>
</svg>
