<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
  <title id="title">掌问课堂仿真组件符号</title>
  <desc id="desc">原创的 LED、按钮、传感器、显示器和执行器抽象符号</desc>
  <defs>
    <g id="led"><circle cx="30" cy="30" r="18" fill="#ef4444"/><path d="M18 56h24" stroke="#334155" stroke-width="4"/></g>
    <g id="resistor"><path d="M5 30h12l8-12 12 24 12-24 8 12h12" fill="none" stroke="#a16207" stroke-width="4"/></g>
    <g id="button"><rect x="8" y="18" width="52" height="34" rx="8" fill="#16a34a"/><circle cx="34" cy="18" r="10" fill="#dcfce7"/></g>
    <g id="potentiometer"><circle cx="34" cy="34" r="24" fill="#f1f5f9" stroke="#475569" stroke-width="4"/><path d="M34 34l14-14" stroke="#0f766e" stroke-width="5"/></g>
    <g id="dht22"><rect x="12" y="8" width="44" height="52" rx="6" fill="#e2e8f0"/><path d="M20 20h28M20 30h28M20 40h28" stroke="#64748b" stroke-width="3"/></g>
    <g id="ssd1306"><rect x="5" y="10" width="62" height="48" rx="5" fill="#1e293b"/><rect x="12" y="17" width="48" height="30" fill="#38bdf8"/></g>
    <g id="neopixel"><circle cx="34" cy="34" r="25" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><circle cx="34" cy="34" r="14" fill="#c084fc"/></g>
    <g id="buzzer"><circle cx="34" cy="34" r="24" fill="#111827"/><circle cx="34" cy="34" r="7" fill="#94a3b8"/></g>
    <g id="servo"><rect x="5" y="16" width="58" height="42" rx="6" fill="#2563eb"/><path d="M34 16V5M18 5h32" stroke="#475569" stroke-width="4"/></g>
  </defs>
  <use href="#led" x="15" y="15"/><use href="#resistor" x="95" y="15"/><use href="#button" x="175" y="15"/>
  <use href="#potentiometer" x="255" y="15"/><use href="#dht22" x="335" y="15"/><use href="#ssd1306" x="415" y="15"/>
  <use href="#neopixel" x="15" y="115"/><use href="#buzzer" x="95" y="115"/><use href="#servo" x="175" y="115"/>
