[project]
name = "zhangwen-local-api"
version = "0.1.0"
description = "掌问本地服务 — FastAPI Sidecar"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not hardware'"
markers = [
  "hardware: requires explicitly authorized real-hardware acceptance and is excluded by default",
]
