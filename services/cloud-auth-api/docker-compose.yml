services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zhangwen_auth
      POSTGRES_USER: zhangwen
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhangwen -d zhangwen_auth"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - cloud-auth-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

  cloud-auth-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - "127.0.0.1:8200:8200"

volumes:
  cloud-auth-postgres:
