<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1400" viewBox="0 0 2200 1400">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#26384d"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3977cf"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#14243a" flood-opacity=".08"/></filter>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#172538}.t{font-size:38px;font-weight:700}.sub{font-size:21px;fill:#53657a}.h{font-size:25px;font-weight:700}.mh{font-size:22px;font-weight:700}.b{font-size:18px}.sm{font-size:16px;fill:#5b6b80}.xs{font-size:14px;fill:#66768b}.c{text-anchor:middle}.bold{font-weight:700}.line{fill:none;stroke:#26384d;stroke-width:2.3;marker-end:url(#a)}.blue{fill:none;stroke:#3977cf;stroke-width:2.2;marker-end:url(#ab)}.dash{fill:none;stroke:#537596;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#ab)}
    </style>
  </defs>
  <rect width="2200" height="1400" fill="#fff"/>
  <text x="40" y="55" class="t">问题引导师架构流程图</text>
  <text x="42" y="90" class="sub">从模糊创意 → 结构化澄清 → 唯一当前推荐方案 → 可验收项目定义</text>

  <g filter="url(#s)">
    <rect x="40" y="120" width="505" height="205" rx="12" fill="#fff8ef" stroke="#e7a052"/>
    <rect x="575" y="120" width="505" height="205" rx="12" fill="#f4f8fe" stroke="#79a9e7"/>
    <rect x="1110" y="120" width="505" height="205" rx="12" fill="#f3faf6" stroke="#78bd96"/>
    <rect x="1645" y="120" width="515" height="205" rx="12" fill="#fff6f6" stroke="#e69b9b"/>
  </g>
  <circle cx="73" cy="158" r="12" fill="#e58a21"/><path d="M66 160c0-7 3-11 7-11s7 4 7 11c0 4-2 6-4 8v4h-6v-4c-2-2-4-4-4-8z" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="98" y="166" class="h" fill="#c66b0c">角色定位</text>
  <text x="72" y="208" class="b bold">从困惑到方案</text>
  <text x="72" y="243" class="b">理解创意、对象、场景与价值</text>
  <text x="72" y="276" class="b">组织少量真正阻塞的问题</text>
  <text x="72" y="309" class="b">把项目变成可确认、可验收的定义</text>

  <circle cx="608" cy="158" r="12" fill="#3977cf"/><path d="M602 152h12v13h-12zM605 149h6" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="633" y="166" class="h" fill="#2b65b8">核心输入</text>
  <text x="607" y="208" class="b">用户原始创意与本轮消息</text>
  <text x="607" y="243" class="b">已确认项目事实与决策</text>
  <text x="607" y="278" class="b">当前方案、产物与待决事项</text>
  <text x="607" y="313" class="b">预算、时间、安全与学习目标</text>

  <circle cx="1143" cy="158" r="12" fill="#2f9f68"/><path d="M1137 158l4 4 8-9" stroke="#fff" stroke-width="2.5" fill="none"/>
  <text x="1168" y="166" class="h" fill="#247b52">主要产出</text>
  <text x="1142" y="208" class="b">中央整组澄清问题</text>
  <text x="1142" y="243" class="b">唯一当前推荐方案</text>
  <text x="1142" y="278" class="b">项目定义、实验计划与立项材料</text>
  <text x="1142" y="313" class="b">教案、任务单与评价量规</text>

  <path d="M1678 145l13 6v10c0 9-6 15-13 20-7-5-13-11-13-20v-10z" fill="#df5c5c"/>
  <text x="1710" y="166" class="h" fill="#bd4848">职责边界</text>
  <text x="1678" y="208" class="b">不直接控制硬件或执行烧录</text>
  <text x="1678" y="243" class="b">未确认推断只能标记为建议</text>
  <text x="1678" y="278" class="b">前台不并列展示多套推荐方案</text>
  <text x="1678" y="313" class="b">技术实现与结构设计交给对应工程师</text>

  <text x="40" y="375" class="h">核心业务流程</text>
  <rect x="30" y="395" width="2140" height="955" rx="16" fill="#fcfdff" stroke="#aab8c8" stroke-width="1.6" stroke-dasharray="10 8"/>

  <!-- main flow -->
  <rect x="65" y="500" width="250" height="230" rx="12" fill="#f2faf5" stroke="#78bd96" stroke-width="1.4"/>
  <text x="190" y="543" class="mh c" fill="#247b52">用户输入</text>
  <text x="190" y="590" class="b c">一句创意或项目问题</text>
  <text x="190" y="630" class="sm c">中央主对话</text>
  <text x="190" y="664" class="sm c">专家胶囊 / @问题引导师</text>
  <text x="190" y="704" class="xs c">输入仍属于同一项目时间线</text>

  <rect x="365" y="500" width="290" height="230" rx="12" fill="#f4f8fe" stroke="#79a9e7" stroke-width="1.4"/>
  <text x="510" y="543" class="mh c" fill="#2b65b8">本地上下文组装</text>
  <text x="510" y="586" class="b c">ContextAssembler</text>
  <text x="510" y="625" class="sm c">已确认事实 / 决策 / 当前方案</text>
  <text x="510" y="658" class="sm c">目标专家私有线程与必要历史</text>
  <text x="510" y="697" class="xs c">不注入其他专家完整私有聊天</text>

  <rect x="705" y="500" width="330" height="230" rx="12" fill="#fff8ef" stroke="#e7a052" stroke-width="1.5"/>
  <text x="870" y="543" class="mh c" fill="#c66b0c">问题引导师 Runtime</text>
  <text x="870" y="584" class="b c">Agent Skill 行为包</text>
  <text x="870" y="622" class="sm c">DISCOVERY：目标 / 场景 / 约束</text>
  <text x="870" y="655" class="sm c">DELIVERABLES：方案 / 教学产物</text>
  <text x="870" y="696" class="xs c">只影响提示词，不扩大工具权限</text>

  <rect x="1085" y="500" width="285" height="230" rx="12" fill="#eef5fe" stroke="#79a9e7" stroke-width="1.4"/>
  <text x="1227" y="543" class="mh c" fill="#2b65b8">DeepSeek 云端 LLM</text>
  <text x="1227" y="590" class="b c">理解需求与生成内容</text>
  <text x="1227" y="630" class="sm c">返回结构化 JSON</text>
  <text x="1227" y="664" class="sm c">最多一次结构修复重试</text>
  <text x="1227" y="704" class="xs c">不能访问本地文件、Shell 或设备</text>

  <polygon points="1510,515 1635,615 1510,715 1385,615" fill="#f8f6fd" stroke="#9e84d1" stroke-width="1.6"/>
  <text x="1510" y="597" class="mh c" fill="#6542aa">信息是否充分？</text>
  <text x="1510" y="634" class="sm c">目标 / 约束 / 成功标准</text>
  <text x="1510" y="665" class="xs c">本地 Schema 与业务规则校验</text>

  <rect x="1700" y="445" width="410" height="230" rx="12" fill="#fff9ef" stroke="#e7a052" stroke-width="1.5"/>
  <text x="1905" y="487" class="mh c" fill="#c66b0c">信息不足：中央整组澄清</text>
  <text x="1905" y="528" class="b c">一次返回 1–6 个结构化问题</text>
  <text x="1905" y="566" class="sm c">单选 / 多选 / 自定义输入</text>
  <text x="1905" y="600" class="sm c">用户一次提交整组答案</text>
  <text x="1905" y="640" class="xs c">答案、源线程与 turn 同事务保存</text>

  <rect x="1700" y="730" width="410" height="255" rx="12" fill="#f2faf5" stroke="#78bd96" stroke-width="1.5"/>
  <text x="1905" y="774" class="mh c" fill="#247b52">信息充分：唯一当前推荐方案</text>
  <text x="1905" y="817" class="b c">实现逻辑 + 硬件方案 + 结构方案</text>
  <text x="1905" y="854" class="sm c">步骤 / 成本 / 难度 / 时间 / 风险</text>
  <text x="1905" y="889" class="sm c">中央确认或继续对话修改</text>
  <text x="1905" y="929" class="xs c">确认后同步 SolutionVersion 与 ArtifactVersion</text>
  <text x="1905" y="959" class="xs c">旧版本只进入产物历史</text>

  <path d="M315 615H365" class="line"/><path d="M655 615H705" class="line"/><path d="M1035 615H1085" class="line"/><path d="M1370 615H1385" class="line"/>
  <path d="M1635 575H1700" class="blue"/><text x="1668" y="554" class="xs c">否</text>
  <path d="M1575 680C1635 733 1650 850 1700 850" class="blue"/><text x="1638" y="735" class="xs c">是</text>
  <path d="M1905 675V700H510V730" class="blue"/>
  <text x="1325" y="692" class="xs c" fill="#3977cf">整组答案回到原问题引导师线程，再次组装上下文</text>

  <!-- persistence and coordination -->
  <rect x="365" y="805" width="1005" height="168" rx="12" fill="#f2f6fa" stroke="#98aabd" stroke-width="1.4"/>
  <text x="867" y="844" class="mh c">本地项目与版本服务</text>
  <rect x="390" y="870" width="210" height="72" rx="8" fill="#fff" stroke="#c3cfdb"/><text x="495" y="900" class="b c">ProjectRepository</text><text x="495" y="928" class="xs c">消息 / 草稿 / 事实 / 决策</text>
  <rect x="620" y="870" width="210" height="72" rx="8" fill="#fff" stroke="#c3cfdb"/><text x="725" y="900" class="b c">ProjectCoordinator</text><text x="725" y="928" class="xs c">任务 / 待办 / 过期传播</text>
  <rect x="850" y="870" width="230" height="72" rx="8" fill="#fff" stroke="#c3cfdb"/><text x="965" y="900" class="b c">SolutionRepository</text><text x="965" y="928" class="xs c">唯一当前方案 / 历史版本</text>
  <rect x="1100" y="870" width="245" height="72" rx="8" fill="#fff" stroke="#c3cfdb"/><text x="1222" y="900" class="b c">ArtifactRepository</text><text x="1222" y="928" class="xs c">方案 / 文档 / 教学产物</text>
  <path d="M870 730V805" class="dash"/><path d="M1370 890H1700" class="dash"/>

  <rect x="65" y="1025" width="2045" height="128" rx="12" fill="#fff9ed" stroke="#e5b55e" stroke-width="1.4"/>
  <text x="1087" y="1060" class="mh c" fill="#ba7414">共享项目事实层</text>
  <text x="250" y="1105" class="b c">用户与场景</text><text x="530" y="1105" class="b c">目标与成功标准</text><text x="820" y="1105" class="b c">预算 / 时间 / 安全</text><text x="1120" y="1105" class="b c">当前方案与决策</text><text x="1445" y="1105" class="b c">产物依赖与版本</text><text x="1870" y="1105" class="b c">任务 / 待决事项</text>
  <text x="1087" y="1138" class="xs c">已确认内容可进入下一轮；未确认推断保持建议或待决，不伪装成事实</text>
  <path d="M870 1025V973" class="dash"/>

  <rect x="65" y="1192" width="2045" height="112" rx="12" fill="#f5f6f8" stroke="#a6afb9" stroke-width="1.4"/>
  <text x="1087" y="1227" class="mh c">本地控制与数据基础</text>
  <text x="260" y="1270" class="b c">FastAPI Sidecar</text><text x="575" y="1270" class="b c">SQLite v25</text><text x="895" y="1270" class="b c">结构化输出校验</text><text x="1245" y="1270" class="b c">Windows 凭据存储</text><text x="1600" y="1270" class="b c">中央确认流</text><text x="1940" y="1270" class="b c">版本化产物</text>
  <path d="M1087 1192V1153" class="dash"/>

</svg>
