name: Deployment smoke (Windows and macOS)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-setup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Hide preinstalled developer runtimes to exercise a fresh computer.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          ./install.ps1 -InstallDir "$env:RUNNER_TEMP/ZhangWen Platform" -Revision "$env:GITHUB_SHA" -DesktopDir "$env:RUNNER_TEMP/ZhangWen Desktop" -NoStart
      - name: Prepare on macOS
        if: runner.os == 'macOS'
        run: PATH=/usr/bin:/bin:/usr/sbin:/sbin ZHANGWEN_INSTALL_DIR="$RUNNER_TEMP/ZhangWen Platform" ZHANGWEN_APPLICATIONS_DIR="$RUNNER_TEMP/Applications" ZHANGWEN_REVISION="$GITHUB_SHA" ZHANGWEN_NO_START=1 bash install.sh
      - name: Verify macOS application launcher
        if: runner.os == 'macOS'
        run: |
          app="$RUNNER_TEMP/Applications/掌问.app"
          test -x "$app/Contents/MacOS/zhangwen"
          plutil -lint "$app/Contents/Info.plist"
          bash -n "$app/Contents/MacOS/zhangwen"
          iconutil -c iconset "$app/Contents/Resources/palm-logo.icns" -o "$RUNNER_TEMP/palm.iconset"
          cmp "$app/Contents/Resources/install-root.txt" <(printf '%s\n' "$RUNNER_TEMP/ZhangWen Platform")
      - name: Verify startup, catalog and local data
        shell: bash
        run: |
          cd "$RUNNER_TEMP/ZhangWen Platform/versions/$GITHUB_SHA"
          if [ "$RUNNER_OS" = Windows ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          PYTHONPATH=services/local-api "$py" - <<'PY'
          import tempfile, gc
          import cadquery as cq
          import trimesh
          from pathlib import Path
          from fastapi.testclient import TestClient
          from zhangwen.mu_web.app import create_app
          from zhangwen.mu_web.__main__ import bind_available_port
          import socket
          with socket.socket() as occupied:
              occupied.bind(('127.0.0.1', 0))
              occupied.listen()
              preferred = occupied.getsockname()[1]
              with bind_available_port(preferred) as available:
                  assert available.getsockname()[0] == '127.0.0.1'
                  assert available.getsockname()[1] != preferred
          with tempfile.TemporaryDirectory() as directory:
              app = create_app(Path(directory), port=3080)
              with TestClient(app, base_url='http://127.0.0.1:3080') as client:
                  assert client.get('/api/health').json()['transport'] == 'web-serial'
                  assert client.get('/').status_code == 200
                  hardware = client.get('/api/hardware').json()['skills']
                  assert len(hardware) >= 258, len(hardware)
                  assert len(client.get('/api/structure/catalog').json()['profiles']) == 32
                  assert abs(cq.Workplane('XY').box(5, 6, 7).val().Volume() - 210) < 0.01
                  token = client.get('/api/session').json()['token']
                  client.headers.update({'origin': 'http://127.0.0.1:3080', 'x-mu-session': token})
                  project = client.post('/api/projects', json={'name':'Structure deployment smoke', 'boardId':'hw_seeed_xiao_esp32s3_sense', 'code':''})
                  assert project.status_code == 201, project.text
                  endpoint = '/api/projects/' + project.json()['id'] + '/structure'
                  draft = client.post(endpoint, json={'action':'selected','expectedRevision':0,'selectedIds':['xiao_esp32s3']})
                  assert draft.status_code == 200 and draft.json()['versions'][0]['result']['status'] == 'confirmation', draft.text
                  built = client.post(endpoint, json={'action':'build','expectedRevision':1})
                  assert built.status_code == 200, built.text
                  result = built.json()['versions'][0]['result']
                  assert result['build']['status'] == 'artifact_exports', result
                  step = next(item for item in result['exports'] if item['id'] == 'cadquery_step')
                  assert b'ISO-10303-21' in client.get(step['url']).content
              # sqlite connections used by repositories can await cyclic GC;
              # release those handles before removing a temporary Windows DB.
              gc.collect()
          PY
      - name: Verify macOS startup repairs a missing application
        if: runner.os == 'macOS'
        run: |
          cd "$RUNNER_TEMP/ZhangWen Platform/versions/$GITHUB_SHA"
          .venv/bin/python - <<'PY'
          import json, os, signal, subprocess, time, urllib.request
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          root = temporary / 'ZhangWen Platform'
          application = temporary / 'Applications/掌问.app'
          application.rename(temporary / 'original-app-before-repair.app')
          sentinel = root / 'data/startup-repair-sentinel.txt'
          sentinel.parent.mkdir(parents=True, exist_ok=True)
          sentinel.write_bytes(b'preserve existing user data')
          environment = {**os.environ, 'ZHANGWEN_DATA_DIR': str(root / 'data'),
                         'ZHANGWEN_RUNTIME_DIR': str(root / 'runtime'),
                         'ZHANGWEN_APPLICATIONS_DIR': str(temporary / 'Applications')}
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with (temporary / 'startup-repair.log').open('w') as log:
              process = subprocess.Popen(['bash', 'start-web.sh', '--no-open'],
                                         env=environment, stdout=log, stderr=log, start_new_session=True)
              try:
                  deadline = time.monotonic() + 180
                  while True:
                      assert process.poll() is None, (temporary / 'startup-repair.log').read_text()
                      try:
                          address = json.loads((root / 'data/.mu-web-address.json').read_text())
                          with opener.open(f'http://127.0.0.1:{address["port"]}/api/health', timeout=1) as response:
                              assert json.load(response)['instanceId'] == address['instanceId']
                          break
                      except (OSError, ValueError, KeyError):
                          assert time.monotonic() < deadline, (temporary / 'startup-repair.log').read_text()
                          time.sleep(0.2)
                  assert os.access(application / 'Contents/MacOS/zhangwen', os.X_OK)
                  assert (root / 'current.txt').read_text().strip() == os.environ['GITHUB_SHA']
                  assert sentinel.read_bytes() == b'preserve existing user data'
                  subprocess.run(['plutil', '-lint', str(application / 'Contents/Info.plist')], check=True)
              finally:
                  os.killpg(process.pid, signal.SIGTERM)
                  process.wait(timeout=15)
          PY
