name: Verify Mu Web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/local-api/requirements-web-lock.txt
      - run: npm ci
      - run: python -m pip install -r services/local-api/requirements-web-lock.txt
      - run: npm run build
      - run: npm test
      - run: npm run test:setup
      - run: npm run test:api
      - run: npm run test:e2e
